<button type="button" class="anomalia" id="anomalia" aria-label="?" title="">
  <img src="juego_qs/assets/shared/ui/glitch_game_gateway.png" alt="" class="anomalia-img">
</button>

<div class="anomalia-panel" id="anomalia-panel" hidden>
  <div class="ap-box">
    <button type="button" class="ap-cerrar" id="btn-cerrar-anomalia" aria-label="Cerrar">✕</button>
    <p class="ap-linea1">SEÑAL ANÓMALA DETECTADA</p>
    <p class="ap-linea2">ORIGEN: DESCONOCIDO</p>
    <button type="button" class="ap-rastrear" id="btn-rastrear">Rastrear</button>
  </div>
</div>

<div class="gateway-glitch" id="gateway-glitch" hidden>
  <img src="juego_qs/assets/shared/ui/glitch_game_gateway.png" alt="">
</div>

<script>
(function () {
  var FLAG = "la_senda_gateway_discovered_v1";
  var DESTINO = "juego_qs/index.html";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var anomalia = document.getElementById("anomalia");
  var panel = document.getElementById("anomalia-panel");
  var glitch = document.getElementById("gateway-glitch");
  var btnRastrear = document.getElementById("btn-rastrear");
  var btnCerrar = document.getElementById("btn-cerrar-anomalia");
  if (!anomalia || !panel || !glitch || !btnRastrear || !btnCerrar) return;

  var yaDescubierta = false;
  try { yaDescubierta = localStorage.getItem(FLAG) === "1"; } catch (e) {}
  if (yaDescubierta) anomalia.classList.add("encontrada");

  function abrirPanel() { panel.hidden = false; btnRastrear.focus(); }
  function cerrarPanel() { panel.hidden = true; anomalia.focus(); }

  anomalia.addEventListener("click", abrirPanel);
  btnCerrar.addEventListener("click", cerrarPanel);
  panel.addEventListener("click", function (e) { if (e.target === panel) cerrarPanel(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.hidden) cerrarPanel();
  });

  btnRastrear.addEventListener("click", function () {
    try { localStorage.setItem(FLAG, "1"); } catch (e) {}
    if (reduce) { window.location.href = DESTINO; return; } // sin animación: navegación directa
    panel.hidden = true;
    glitch.hidden = false;
    glitch.classList.add("activo");
    setTimeout(function () { window.location.href = DESTINO; }, 650);
  });
})();
</script>
